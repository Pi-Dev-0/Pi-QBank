name: webview_cef
description: >-
  Vendored Linux-only copy of webview_cef 0.2.2 (CEF-backed WebView).
  Carries the local scroll-direction fix; see common/webview_handler.cc.
version: 0.2.2
homepage: https://github.com/hlwhl/webview_cef
repository: https://github.com/hlwhl/webview_cef

environment:
  sdk: ">=2.17.1 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: WebviewCefPlugin
